    <style>
      body {
        background-color: #ffffff;
      }
      
      /* 保持原有样式，此处省略... */
      button.accordion {
      font:14px/1.5 Lato, "Helvetica Neue", Helvetica, Arial, sans-serif;
      cursor: pointer;
      padding: 0px;
      border: none;
      text-align: left;
      outline: none;
      font-size: 100%;
      transition: 0.3s;
      background-color:  #f0f0f0;
      }
      button.accordion.active, button.accordion:hover {
      background-color:  #f0f0f0;
      }
      button.accordion:after {
      content: " [+] ";
      font-size: 90%;
      color:#777;
      float: left;
      margin-left: 1px;
      }

      button.accordion.active:after {
      content: " [\2212] ";
      }
      div.panel {
      padding: 0 20px;
      margin-top: 5px;
      display: none;
      background-color: white;
      font-size: 100%;
      }
      div.panel.show {
      display: block !important;
      }
      .social-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
      }
      
      /* ====== 新增/修改样式以实现顶部导航栏和照片-文字布局 ====== */
      
      /* 顶部导航容器：用于容纳 Home, Research, Teaching, CV */
      .top-navigation {
          display: flex;
          justify-content: flex-end; /* 导航链接靠右对齐 */
          gap: 20px; /* 链接之间的间距 */
          padding: 10px 0;
          border-bottom: 1px solid #eee; /* 底部加一条细线，可选 */
      }
      .top-navigation a {
          text-decoration: none;
          color: #333;
          font-weight: bold;
          font-size: 1.1em;
      }

      /* 移除 Header 中原有的导航链接样式 */
      header h3 {
          display: none;
      }

      /* 左侧照片和信息布局 (与上次的需求相似) */
      .main-profile-area {
          display: flex;
          align-items: flex-start;
          gap: 30px;
          margin-top: 30px;
      }
      
      /* 左栏：照片、姓名、职位 */
      .profile-info {
          flex: 0 0 auto; /* 自动宽度 */
          text-align: center;
          padding-top: 5px; /* 调整垂直位置 */
      }
      
      /* 右栏：介绍文字 */
      .intro-text {
          flex-grow: 1;
      }
      
      /* 照片样式 */
      .image-container {
        max-width: 400px;  
        margin: 0 auto 0 auto;  
        text-align: center;
      }
      .profile-headshot {
        width: 180px;  
        height: 180px;  
        border-radius: 50%;  
        object-fit: cover;  
        border: 8px solid #ffffff;  
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);  
        margin-top: 10px;  
        margin-bottom: 15px; /* 照片下方间距 */
      }
      
      /* 姓名和职位样式 */
      .profile-info h1 {
          font-size: 1.8em;
          margin-top: 0;
          margin-bottom: 5px;
      }
      .profile-info p {
          font-size: 1.1em;
          margin: 0 0 10px 0;
          color: #555;
      }
      
      /* 隐藏原有的左侧栏联系信息，因为我们已经将其部分移动到顶部或照片下方 */
      header .view, header p {
          display: none;
      }

      /* 保持您的介绍部分样式 */
      .intro-box {
          padding: 10px 20px 5px 20px; 
          background-color: #f9f9f9; 
          font-family: 'Lato', 'Helvetica Neue', Helvetica, Arial, sans-serif; 
          font-size: 15px; 
          color: #444; 
          margin-top: 10px;
          line-height: 1.6;
      }
